name: E2E Playwright Suite

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly run at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright-e2e:
    name: Playwright Critical Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 20.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build platform packages and applications
        run: npm run build

      - name: Run Playwright E2E Tests
        run: npx playwright test --project=chromium --project=mobile-chrome
        env:
          CI: true
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/gathergrid_e2e
          JWT_ACCESS_SECRET: e2e-access-secret-32-chars-long-minimum!
          JWT_REFRESH_SECRET: e2e-refresh-secret-32-chars-long-minimum!

      - name: Upload Playwright Test Report & Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
